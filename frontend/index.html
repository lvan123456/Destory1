<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识费曼化 + 记忆宫殿可视化</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="h-full bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors">
  <div class="max-w-7xl mx-auto px-4 py-6 md:py-10">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl md:text-4xl font-bold">知识费曼化 + 记忆宫殿可视化</h1>
        <p class="text-sm md:text-base text-slate-600 dark:text-slate-300">输入任意知识，一键生成小白讲解与可交互记忆场景。</p>
      </div>
      <button id="themeBtn" class="px-4 py-2 rounded-xl bg-slate-800 text-white dark:bg-yellow-400 dark:text-slate-900">切换明暗模式</button>
    </header>

    <section class="grid lg:grid-cols-2 gap-5">
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5">
        <h2 class="font-semibold text-xl mb-3">1) 知识输入区</h2>
        <input id="titleInput" class="w-full mb-3 px-3 py-2 rounded-lg border dark:bg-slate-900" placeholder="主题标题（可选）" />
        <textarea id="contentInput" rows="10" class="w-full px-3 py-2 rounded-lg border dark:bg-slate-900" placeholder="请输入任意领域知识，如HTTP、牛顿三大定律、玄武门之变等"></textarea>
        <div class="flex justify-between mt-2 text-sm text-slate-500">
          <span id="charCount">0 字</span>
          <div class="space-x-2">
            <button id="clearBtn" class="px-3 py-1 rounded bg-slate-200 dark:bg-slate-700">清空</button>
            <button id="submitBtn" class="px-3 py-1 rounded bg-indigo-600 text-white">提交生成</button>
          </div>
        </div>
        <div id="loading" class="hidden mt-3 text-indigo-600">⏳ 正在生成内容，请稍候...</div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5">
        <h2 class="font-semibold text-xl mb-3">历史记录（本地存储）</h2>
        <ul id="historyList" class="space-y-2 max-h-72 overflow-auto"></ul>
      </div>
    </section>

    <section id="resultSection" class="hidden mt-6 grid xl:grid-cols-2 gap-5">
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5">
        <h2 class="font-semibold text-xl mb-4">2) 费曼化讲解区</h2>
        <div class="grid gap-3">
          <article class="p-3 rounded-xl bg-sky-50 dark:bg-slate-900">
            <h3 class="font-semibold text-sky-700 dark:text-sky-300">通俗定义</h3>
            <p id="plainDef"></p>
          </article>
          <article class="p-3 rounded-xl bg-emerald-50 dark:bg-slate-900">
            <h3 class="font-semibold text-emerald-700 dark:text-emerald-300">生活类比</h3>
            <p id="analogy"></p>
          </article>
          <article class="p-3 rounded-xl bg-amber-50 dark:bg-slate-900">
            <h3 class="font-semibold text-amber-700 dark:text-amber-300">实战例子</h3>
            <p id="example" class="whitespace-pre-line"></p>
          </article>
          <article class="p-3 rounded-xl bg-rose-50 dark:bg-slate-900">
            <h3 class="font-semibold text-rose-700 dark:text-rose-300">易错点提醒</h3>
            <ul id="pitfalls" class="list-disc ml-5"></ul>
          </article>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5">
        <h2 class="font-semibold text-xl mb-2">3) 记忆宫殿可视化区</h2>
        <p id="palaceTheme" class="text-sm text-slate-500 mb-3"></p>
        <div class="flex items-center justify-between mb-3">
          <button id="prevScene" class="px-3 py-1 rounded bg-slate-200 dark:bg-slate-700">← 上一场景</button>
          <span id="sceneIndex" class="text-sm"></span>
          <button id="nextScene" class="px-3 py-1 rounded bg-slate-200 dark:bg-slate-700">下一场景 →</button>
        </div>
        <div id="sceneCard" class="rounded-2xl p-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white min-h-48 cursor-pointer">
          <h3 id="sceneRoom" class="font-bold text-xl"></h3>
          <p id="sceneDesc" class="mt-2"></p>
          <div class="mt-3 p-3 rounded-xl bg-white/20">
            <div class="font-semibold">绑定要点</div>
            <p id="scenePoint"></p>
          </div>
          <div id="tooltip" class="mt-3 hidden p-2 rounded bg-black/40 text-sm"></div>
        </div>
      </div>
    </section>
  </div>

<script>
const API_BASE = 'http://127.0.0.1:8000/api';
let palaceScenes = [];
let currentScene = 0;

const contentInput = document.getElementById('contentInput');
const charCount = document.getElementById('charCount');
const historyList = document.getElementById('historyList');
const loading = document.getElementById('loading');

function updateCount() { charCount.textContent = `${contentInput.value.length} 字`; }
contentInput.addEventListener('input', updateCount);

function saveHistory(record) {
  const history = JSON.parse(localStorage.getItem('km_history') || '[]');
  history.unshift(record);
  localStorage.setItem('km_history', JSON.stringify(history.slice(0, 8)));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('km_history') || '[]');
  historyList.innerHTML = history.map(h => `<li class="p-2 rounded bg-slate-100 dark:bg-slate-900"><b>${h.title}</b><div class="text-xs text-slate-500">${h.time}</div></li>`).join('') || '<li class="text-slate-500">暂无历史记录</li>';
}

function renderScene() {
  if (!palaceScenes.length) return;
  const scene = palaceScenes[currentScene];
  document.getElementById('sceneRoom').textContent = scene.room;
  document.getElementById('sceneDesc').textContent = scene.scene_description;
  document.getElementById('scenePoint').textContent = scene.point;
  document.getElementById('tooltip').textContent = `记忆提示：${scene.memory_hint}`;
  document.getElementById('sceneIndex').textContent = `${currentScene + 1} / ${palaceScenes.length}`;
}

async function handleSubmit() {
  const content = contentInput.value.trim();
  const title = document.getElementById('titleInput').value.trim() || '未命名主题';
  if (content.length < 30) return alert('请至少输入30个字符，便于提取核心知识。');

  loading.classList.remove('hidden');
  try {
    const submitRes = await fetch(`${API_BASE}/knowledge/submit`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title, content })
    });
    const submitData = await submitRes.json();
    if (!submitRes.ok) throw new Error(submitData.detail || '提交失败');

    const [feynmanRes, palaceRes] = await Promise.all([
      fetch(`${API_BASE}/feynman/${submitData.submission_id}`),
      fetch(`${API_BASE}/palace/${submitData.submission_id}`)
    ]);
    const f = await feynmanRes.json();
    const p = await palaceRes.json();

    document.getElementById('plainDef').textContent = f.plain_definition;
    document.getElementById('analogy').textContent = f.life_analogy;
    document.getElementById('example').textContent = f.practical_example;
    document.getElementById('pitfalls').innerHTML = f.pitfalls.map(x => `<li>${x}</li>`).join('');

    document.getElementById('palaceTheme').textContent = p.palace_theme;
    palaceScenes = p.scenes;
    currentScene = 0;
    renderScene();

    document.getElementById('resultSection').classList.remove('hidden');
    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });

    saveHistory({ title, time: new Date().toLocaleString() });
  } catch (e) {
    alert(`生成失败：${e.message}`);
  } finally {
    loading.classList.add('hidden');
  }
}

const tooltip = document.getElementById('tooltip');
document.getElementById('sceneCard').addEventListener('mouseenter', () => tooltip.classList.remove('hidden'));
document.getElementById('sceneCard').addEventListener('mouseleave', () => tooltip.classList.add('hidden'));
document.getElementById('sceneCard').addEventListener('click', () => {
  currentScene = (currentScene + 1) % palaceScenes.length;
  renderScene();
});

document.getElementById('prevScene').addEventListener('click', () => {
  if (!palaceScenes.length) return;
  currentScene = (currentScene - 1 + palaceScenes.length) % palaceScenes.length;
  renderScene();
});
document.getElementById('nextScene').addEventListener('click', () => {
  if (!palaceScenes.length) return;
  currentScene = (currentScene + 1) % palaceScenes.length;
  renderScene();
});

let startX = 0;
document.getElementById('sceneCard').addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
document.getElementById('sceneCard').addEventListener('touchend', (e) => {
  if (!palaceScenes.length) return;
  const delta = e.changedTouches[0].clientX - startX;
  if (Math.abs(delta) < 30) return;
  currentScene = delta > 0 ? (currentScene - 1 + palaceScenes.length) % palaceScenes.length : (currentScene + 1) % palaceScenes.length;
  renderScene();
});

document.getElementById('clearBtn').addEventListener('click', () => { contentInput.value = ''; document.getElementById('titleInput').value = ''; updateCount(); });
document.getElementById('submitBtn').addEventListener('click', handleSubmit);
document.getElementById('themeBtn').addEventListener('click', () => document.documentElement.classList.toggle('dark'));

renderHistory();
updateCount();
</script>
</body>
</html>
